# Headless profili — yourkiosk otomasyonu ve yerel tek seferlik görevler.
# Web profiliyle aynı özel OpenAI-uyumlu uç noktayı kullanır; kimlik bilgisi
# ~/.dsh/.env içindeki DEEPSEEK_API_KEY'den gelir (headless credential store'u kapalı).
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  config:
    baseURL: https://evren-llmapi.ssyz.org.tr/v1
    apiKeyEnv: DEEPSEEK_API_KEY
    models:
      - id: deepseek-v4.1-flash
        name: DeepSeek-V4.1-Flash
        contextWindow: 1048576
        systemPromptUpdate: in-history
        toolUpdate: addition-only
        inputModalities:
          - text
          - image

- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-official
    model: deepseek-v4.1-flash

# 2026-11-08 i5 yüksek bulgusu: DSH workspace-write bir güvenlik sınırı değil.
# Review ajanı read-only çalışır; özel bwrap runner'ı user systemd ve D-Bus'u maskeler.
- id: sandbox
  name: "@deepseek-ai/dsh-sandbox-local"
  config:
    runnerCommand:
      - /home/hakki/.agents/bin/dsh-bwrap-kiosk
    runnerFailureSignatures:
      - "dsh-bwrap-kiosk:"

# 2026-11-09 i5 üçüncü tur: bwrap yalnız bash'i sarar; DSH'nin native fs/web/
# delegation araçları sandbox DIŞINDA çalışır. Review profilinde bunları kapat.
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-web
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-agent-team
  disabled: true
- id: tool-subagent-control
  disabled: true
