# Otonom koordinatör geliştirici profili — dsh-base + dsh-headless üzerine yama.
# Runner ve araç kısıtları repo ile sürümlenir; otonom-kur.sh mutlak yolu $HOME'a göre yazar.
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  config:
    baseURL: https://evren-llmapi.ssyz.org.tr/v1
    apiKeyEnv: DEEPSEEK_API_KEY
    models:
      - id: deepseek-v4.1-flash
        name: DeepSeek-V4.1-Flash
        contextWindow: 1048576
        systemPromptUpdate: in-history
        toolUpdate: addition-only
        inputModalities:
          - text
          - image

- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-official
    model: deepseek-v4.1-flash

- id: sandbox
  name: "@deepseek-ai/dsh-sandbox-local"
  config:
    runnerCommand:
      - /home/hakki/.agents/bin/dsh-bwrap-gelistirici
    runnerFailureSignatures:
      - "dsh-bwrap-gelistirici:"

# Native fs/web/delegation araçları bwrap dışında çalışır; koordinatörde kapalı.
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-web
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-agent-team
  disabled: true
- id: tool-subagent-control
  disabled: true
